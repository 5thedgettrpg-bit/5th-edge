name: Renew Drive webhook

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: renew-drive-webhook
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/594098443798/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "id-th-edge-r2-sync@project-7f26e92d-3a97-4eec-9b9.iam.gserviceaccount.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            google-api-python-client google-auth boto3

      - name: Register Drive notification channel
        env:
          GDRIVE_CHANNEL_TOKEN: ${{ secrets.GDRIVE_CHANNEL_TOKEN }}
          GDRIVE_WEBHOOK_URL: "https://5th-edge-drive-webhook.5thedgettrpg.workers.dev/google-drive"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: "5th-edge-assets"
        run: python scripts/register-drive-watch.py
