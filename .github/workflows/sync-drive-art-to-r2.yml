name: Sync Drive art to R2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: drive-art-to-r2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/594098443798/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "id-th-edge-r2-sync@project-7f26e92d-3a97-4eec-9b9.iam.gserviceaccount.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            google-api-python-client google-auth boto3

      - name: Sync Google Drive art to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GDRIVE_ROOT_FOLDER_ID: "1hAkXLwRktZ-bUWhboiGbg8KIlQqmKVEu"
          R2_BUCKET: "5th-edge-assets"
          ASSET_BASE_URL: "https://assets.5thedgettrpg.com"
          DELETE_STALE: "false"
        run: python scripts/sync-drive-to-r2.py
